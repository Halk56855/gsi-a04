name: Build HyperOS GSI for A04 (Modern A14 Builder)

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'رابط الروم الثابت الخاص بك'
        required: true
        default: 'https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/V816.0.5.0.UGRMIXM/blue_global_images_V816.0.5.0.UGRMIXM_20240328.0000.00_14.0_90379c256c.tgz'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Free Up Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        large-packages: true
        swap-storage: true

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git aria2 p7zip-full unrar zip unzip tar gawk swig libssl-dev python3-pip android-sdk-libsparse-utils

    - name: Clone Compatible Treble GSI Tools
      run: |
        git clone --depth=1 https://github.com/phhusson/treble_experimentations.git phh
        mkdir -p input output

    - name: Download ROM Safely
      run: |
        ROM_URL="${{ github.event.inputs.rom_url }}"
        aria2c -x16 -s16 --max-tries=5 "$ROM_URL" -d input/

    - name: Extract and Collect MediaTek Images
      run: |
        echo "Extracting HyperOS Fastboot firmware..."
        cd input
        tar -I pigz -xvf *.tgz || tar -xvf *.tgz || 7z x *.tgz -r
        cd ..
        
        echo "Locating and gathering firmware images from MediaTek ROM package..."
        # البحث عن مجلد images النسقي ونقل كافة ملفات الـ img وملفات النظام بداخله إلى مجلد الـ output
        find input/ -type d -name "images" -exec cp -r {}/. output/ \;
        
        # كطريقة احتياطية: البحث عن أي ملف امتداده .img أو .bin ونقله أيضاً
        find input/ -name "*.img" -exec cp {} output/ \; || true
        
        echo "Contents of output directory:"
        ls -la output/

    - name: Upload Final GSI Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HyperOS-MTK-Images-Samsung-A04
        path: output/*
