name: Build OEM-GSI for Galaxy A04

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'رابط الروم الثابت الخاص بك'
        required: true
        default: 'https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/V816.0.5.0.UGRMIXM/blue_global_images_V816.0.5.0.UGRMIXM_20240328.0000.00_14.0_90379c256c.tgz'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Free Up Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git aria2 p7zip-full zip unzip tar swig libssl-dev python3-pip

    - name: Clone OEM-GSI-Builder
      run: |
        git clone --recursive https://github.com/nitanmarcel/OEM-GSI-Builder.git builder
        cd builder
        mkdir -p input output

    - name: Download ROM & Setup
      run: |
        cd builder
        ROM_URL="${{ github.event.inputs.rom_url }}"
        
        # تحميل الروم المباشر بالسرعة القصوى
        aria2c -x16 -s16 --max-tries=5 "$ROM_URL" -d input/

    - name: Run GSI Build for A04 (ARM64-AB)
      run: |
        cd builder
        # تشغيل الأداة لبناء GSI معمّر بنية ARM64-AB المناسبة لـ A04 مع تحسينات الأداء
        sudo bash build.sh input/* AB arm64

    - name: Upload Finished GSI Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HyperOS-GSI-Samsung-A04
        path: builder/output/*.img
