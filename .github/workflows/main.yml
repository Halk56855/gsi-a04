name: Build HyperOS GSI for A04

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Direct URL to MIUI/HyperOS ROM (.zip)'
        required: true
        default: 'https://bigota.d.miui.com/V14.0.8.0.TMTTRXM/miui_TAPASGlobal_V14.0.8.0.TMTTRXM_72b3887d13_13.0.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gawk aria2 p7zip-full unrar zip unzip simg2img img2simg android-sdk-libsparse-utils

    - name: Clone GSI Porter Tool
      run: |
        git clone --depth=1 https://github.com/erfanoabdi/ErfanGSIs.git ErfanGSI
        cd ErfanGSI
        mkdir input output

    - name: Download & Optimize ROM
      run: |
        cd ErfanGSI
        # سحب الرابط المباشر الموجود في الـ inputs
        ROM_URL="${{ github.event.inputs.rom_url }}"
        aria2c -x16 -s16 "$ROM_URL" -d input/
        
        # تخصيص ملفات النظام لتقليل استهلاك المعالج والرام لهاتف A04
        echo "ro.config.low_ram=true" >> build/templates/gsi_system_prop
        echo "ro.ambient.blur.supported=false" >> build/templates/gsi_system_prop
        echo "debug.sf.nobootanimation=1" >> build/templates/gsi_system_prop

    - name: Execute GSI Generation
      run: |
        cd ErfanGSI
        # تحويل الروم إلى GSI بصيغة A/B
        sudo ./url2GSI.sh input/* Generic A/B

    - name: Upload Finished GSI
      uses: actions/upload-artifact@v4
      with:
        name: HyperOS-GSI-A04
        path: ErfanGSI/output/*.img
