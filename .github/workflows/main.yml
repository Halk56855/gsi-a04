name: Patch and Compress GSI

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
  
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download and Extract GSI
      run: |
        sudo apt-get update && sudo apt-get install -y aria2 p7zip-full
        aria2c -x 16 -s 16 -j 16 -o gsi.7z "https://downloads.sourceforge.net/project/idkgsiupdate/HyperOS/HyperOS-AB-14-2026-01-14-idkGSI.7z"
        7z x gsi.7z
        mv HyperOS-AB-14-2026-01-14-idkGSI.img system.img

    - name: Apply Linux Commands & Compress
      run: |
        mkdir -p ~/hyperui_mount
        sudo mount -o loop system.img ~/hyperui_mount
        sudo cp miui-services.jar ~/hyperui_mount/system_ext/framework/
        sync
        sudo umount ~/hyperui_mount
        
        # ضغط ملف النظام بـ 7z بأقصى ضغط لتقليل الحجم وسهولة التحميل
        echo "Compressing system.img..."
        7z a -t7z -mx=9 patched-system.7z system.img

    - name: Upload Compressed Artifact
      uses: actions/upload-artifact@v4
      with:
        name: patched-system-7z
        path: patched-system.7z
