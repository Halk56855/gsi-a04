name: Patch HyperOS GSI

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
  
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download and Extract GSI
      run: |
        echo "Downloading HyperOS GSI from SourceForge..."
        wget -O gsi.7z "https://downloads.sourceforge.net/project/idkgsiupdate/HyperOS/HyperOS-AB-14-2026-01-14-idkGSI.7z"
        
        echo "Extracting the GSI image..."
        7z x gsi.7z
        
        # إعادة تسمية الملف المستخرج ليتطابق مع اسم النظام الداخلي
        mv HyperOS-AB-14-2026-01-14-idkGSI.img system.img

    - name: Mount and Patch
      run: |
        sudo mkdir -p /mnt/hyperui_mount
        LOOP_DEV=$(sudo losetup --find --show system.img)
        sudo mount "$LOOP_DEV" /mnt/hyperui_mount
        
        echo "Injecting miui-services.jar..."
        sudo cp -f miui-services.jar /mnt/hyperui_mount/system_ext/framework/miui-services.jar
        sudo chmod 644 /mnt/hyperui_mount/system_ext/framework/miui-services.jar
        
        echo "Unmounting..."
        sudo umount /mnt/hyperui_mount
        sudo losetup -D

    - name: Upload Modified system.img
      uses: actions/upload-artifact@v4
      with:
        name: patched-system-img
        path: system.img
