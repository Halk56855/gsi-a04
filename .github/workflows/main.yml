name: Build HyperOS GSI for A04 (Final Step)

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'رابط الروم الثابت الخاص بك'
        required: true
        default: 'https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/V816.0.5.0.UGRMIXM/blue_global_images_V816.0.5.0.UGRMIXM_20240328.0000.00_14.0_90379c256c.tgz'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Free Up Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        large-packages: true
        swap-storage: true

    - name: Install System Dependencies & lpunpack
      run: |
        sudo apt-get update
        sudo apt-get install -y git aria2 p7zip-full unrar zip unzip tar gawk swig libssl-dev python3-pip android-sdk-libsparse-utils
        
        # تحميل أداة lpunpack الجاهزة والموثوقة خصيصاً للـ Linux
        sudo wget -q https://github.com/upgradeproject/lpunpack_binary/raw/main/lpunpack -O /usr/local/bin/lpunpack || \
        sudo wget -q https://raw.githubusercontent.com/xiaoxindada/mobile_build_scripts/main/lpunpack -O /usr/local/bin/lpunpack
        sudo chmod +x /usr/local/bin/lpunpack
        
        # التأكد من عمل الأداة
        lpunpack --help || echo "lpunpack installed"

    - name: Clone GSI Extraction Tools
      run: |
        git clone --depth=1 https://github.com/phhusson/treble_experimentations.git phh
        mkdir -p input output extracted_super

    - name: Download ROM Safely
      run: |
        ROM_URL="${{ github.event.inputs.rom_url }}"
        aria2c -x16 -s16 --max-tries=5 "$ROM_URL" -d input/

    - name: Extract super.img & Package GSI Directly
      run: |
        echo "Extracting HyperOS firmware package..."
        cd input
        tar -I pigz -xvf *.tgz || tar -xvf *.tgz || 7z x *.tgz -r
        cd ..
        
        echo "Locating super.img..."
        SUPER_PATH=$(find input/ -name "super.img" | head -n 1)
        
        if [ -z "$SUPER_PATH" ]; then
          echo "Error: super.img not found!"
          exit 1
        fi
        
        echo "Unpacking super.img using lpunpack..."
        simg2img "$SUPER_PATH" super_raw.img || cp "$SUPER_PATH" super_raw.img
        
        # تنفيذ الفك الفعلي
        lpunpack super_raw.img extracted_super/
        
        echo "Processing extracted partitions..."
        ls -la extracted_super/
        
        # أخذ ملف system_a.img وتسميته كملف GSI نهائي
        if [ -f "extracted_super/system_a.img" ]; then
          cp extracted_super/system_a.img output/HyperOS-A04-GSI.img
          echo "Successfully packaged system_a.img as HyperOS-A04-GSI.img!"
        elif [ -f "extracted_super/system.img" ]; then
          cp extracted_super/system.img output/HyperOS-A04-GSI.img
          echo "Successfully packaged system.img as HyperOS-A04-GSI.img!"
        else
          cp -r extracted_super/* output/ || true
        fi
        
        ls -la output/

    - name: Upload Final GSI Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HyperOS-Final-GSI-Samsung-A04
        path: output/*
