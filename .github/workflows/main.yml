name: Build HyperOS GSI for A04 (ErfanGSIs)

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'رابط الروم الثابت الخاص بك'
        required: true
        default: 'https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/V816.0.5.0.UGRMIXM/blue_global_images_V816.0.5.0.UGRMIXM_20240328.0000.00_14.0_90379c256c.tgz'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gawk aria2 p7zip-full unrar zip unzip android-sdk-libsparse-utils git

    - name: Clone ErfanGSI & Update Submodules
      run: |
        git clone --recursive https://github.com/erfanoabdi/ErfanGSIs.git ErfanGSI
        cd ErfanGSI
        # تحديث الأدوات الفرعية لضمان التوافق مع فك حزم أندرويد 14
        git submodule update --init --recursive
        mkdir -p input output build/templates

    - name: Download ROM & Inject Optimizations for Galaxy A04
      run: |
        cd ErfanGSI
        ROM_URL="${{ github.event.inputs.rom_url }}"
        
        # تحميل الروم الثابت الخاص بك بسرعة عالية مع إعادة المحاولة
        aria2c -x16 -s16 --max-tries=5 "$ROM_URL" -d input/
        
        touch build/templates/gsi_system_prop
        
        # تحسينات الأداء والرام ومعالج MediaTek لهاتف Samsung A04
        echo "ro.config.low_ram=true" >> build/templates/gsi_system_prop
        echo "ro.ambient.blur.supported=false" >> build/templates/gsi_system_prop
        echo "debug.sf.nobootanimation=1" >> build/templates/gsi_system_prop
        echo "persist.sys.ui.hw=true" >> build/templates/gsi_system_prop

    - name: Bypass Version Check & Execute GSI Generation
      run: |
        cd ErfanGSI
        # تعديل فحص الإصدار في السكربت لتخطي رفض أندرويد 14 نهائياً
        sed -i 's/14 is not supported/echo "Bypassing A14 check..."/g' url2GSI.sh || true
        sed -i 's/exit 1//g' url2GSI.sh || true
        
        # تشغيل الأداة لبناء GSI معمّر بنية A/B المناسبة لـ A04
        sudo ./url2GSI.sh input/* Generic A/B

    - name: Upload Finished GSI Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HyperOS-GSI-Samsung-A04
        path: ErfanGSI/output/*.img
