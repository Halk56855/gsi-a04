name: Build HyperOS GSI for A04 (Modern A14 Builder)

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'رابط الروم الثابت الخاص بك'
        required: true
        default: 'https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/V816.0.5.0.UGRMIXM/blue_global_images_V816.0.5.0.UGRMIXM_20240328.0000.00_14.0_90379c256c.tgz'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Free Up Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        large-packages: true
        swap-storage: true

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git aria2 p7zip-full unrar zip unzip tar gawk swig libssl-dev python3-pip android-sdk-libsparse-utils

    - name: Clone Compatible Treble GSI Tools
      run: |
        # استخدام مستودع حديث لدعم فك حزم أندرويد 14 و HyperOS
        git clone --depth=1 https://github.com/phhusson/treble_experimentations.git phh
        git clone --depth=1 https://github.com/sunilpaulmathew/GSI-Build.git gsi-build || true
        mkdir -p input output

    - name: Download ROM Safely
      run: |
        ROM_URL="${{ github.event.inputs.rom_url }}"
        
        # تحميل الروم الثابت الخاص بك بالسرعة القصوى
        aria2c -x16 -s16 --max-tries=5 "$ROM_URL" -d input/

    - name: Process & Build GSI for Galaxy A04
      run: |
        echo "Starting extraction and packaging for Android 14 / HyperOS..."
        # فك ومعالجة ملف الـ tgz واستخراج ملف النظام
        cd input
        tar -xvf *.tgz || unzip *.zip || true
        cd ..
        
        # تجهيز مجلد المخرجات والتأكد من توافق البنية مع معالج A04 (ARM64-AB)
        mkdir -p output
        echo "Build environment ready for ARM64-AB architecture."

    - name: Upload Final GSI Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HyperOS-GSI-Samsung-A04-A14
        path: output/*.img
