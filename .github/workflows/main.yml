name: Build HyperOS/MIUI GSI for A04

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'رابط مباشر لروم MIUI مبني على أندرويد 13 (.zip أو .tgz)'
        required: true
        default: 'https://bigota.d.miui.com/V14.0.8.0.TMTTRXM/miui_TAPASGlobal_V14.0.8.0.TMTTRXM_72b3887d13_13.0.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gawk aria2 p7zip-full unrar zip unzip android-sdk-libsparse-utils

    - name: Clone GSI Porter Tool
      run: |
        git clone --depth=1 https://github.com/erfanoabdi/ErfanGSIs.git ErfanGSI
        cd ErfanGSI
        mkdir -p input output build/templates

    - name: Download & Optimize ROM for Galaxy A04
      run: |
        cd ErfanGSI
        ROM_URL="${{ github.event.inputs.rom_url }}"
        
        if [ -z "$ROM_URL" ]; then
          echo "Error: Please provide a valid direct ROM URL!"
          exit 1
        fi
        
        aria2c -x16 -s16 --max-tries=5 "$ROM_URL" -d input/
        
        touch build/templates/gsi_system_prop
        
        # تحسينات وتعديلات لتعريفات معالج MediaTek والذاكرة لهاتف Samsung A04
        echo "ro.config.low_ram=true" >> build/templates/gsi_system_prop
        echo "ro.ambient.blur.supported=false" >> build/templates/gsi_system_prop
        echo "debug.sf.nobootanimation=1" >> build/templates/gsi_system_prop
        echo "persist.sys.ui.hw=true" >> build/templates/gsi_system_prop

    - name: Execute GSI Generation
      run: |
        cd ErfanGSI
        sudo ./url2GSI.sh input/* Generic A/B

    - name: Upload Finished GSI
      uses: actions/upload-artifact@v4
      with:
        name: MIUI-GSI-Samsung-A04
        path: ErfanGSI/output/*.img
