name: Build HyperOS GSI for A04

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'رابط الروم الخاص بك'
        required: true
        default: 'https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/V816.0.5.0.UGRMIXM/blue_global_images_V816.0.5.0.UGRMIXM_20240328.0000.00_14.0_90379c256c.tgz'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gawk aria2 p7zip-full unrar zip unzip android-sdk-libsparse-utils

    - name: Clone GSI Porter Tool (Android 14 Support)
      run: |
        # سحب أداة التحويل مع جلب الفروع الحديثة لتدعم أندرويد 14
        git clone --depth=1 https://github.com/erfanoabdi/ErfanGSIs.git ErfanGSI
        cd ErfanGSI
        mkdir -p input output build/templates

    - name: Download & Optimize ROM for Galaxy A04
      run: |
        cd ErfanGSI
        # استخدام الرابط الذي أرسلته حرفياً دون أي تغيير
        ROM_URL="${{ github.event.inputs.rom_url }}"
        
        aria2c -x16 -s16 --max-tries=5 "$ROM_URL" -d input/
        
        touch build/templates/gsi_system_prop
        
        # تحسينات الأداء والرام ومعالج MediaTek لهاتف Samsung A04
        echo "ro.config.low_ram=true" >> build/templates/gsi_system_prop
        echo "ro.ambient.blur.supported=false" >> build/templates/gsi_system_prop
        echo "debug.sf.nobootanimation=1" >> build/templates/gsi_system_prop
        echo "persist.sys.ui.hw=true" >> build/templates/gsi_system_prop

    - name: Execute GSI Generation
      run: |
        cd ErfanGSI
        # تنفيذ التحويل مع تجاوز قيود الإصدارات
        sudo bash -c "export ALLOW_MISSING_DEPENDENCIES=true; ./url2GSI.sh input/* Generic A/B"

    - name: Upload Finished GSI
      uses: actions/upload-artifact@v4
      with:
        name: HyperOS-GSI-Samsung-A04
        path: ErfanGSI/output/*.img
