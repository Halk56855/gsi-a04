name: Build HyperOS GSI for A04 (Final Step)

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'رابط الروم الثابت الخاص بك'
        required: true
        default: 'https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/V816.0.5.0.UGRMIXM/blue_global_images_V816.0.5.0.UGRMIXM_20240328.0000.00_14.0_90379c256c.tgz'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Free Up Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        large-packages: true
        swap-storage: true

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git aria2 p7zip-full unrar zip unzip tar gawk swig libssl-dev python3-pip android-sdk-libsparse-utils python3-setuptools

    - name: Clone GSI Extraction Tools
      run: |
        git clone --depth=1 https://github.com/phhusson/treble_experimentations.git phh
        mkdir -p input output extracted_super

    - name: Download ROM Safely
      run: |
        ROM_URL="${{ github.event.inputs.rom_url }}"
        aria2c -x16 -s16 --max-tries=5 "$ROM_URL" -d input/

    - name: Extract super.img & Robust Partition Extraction
      run: |
        echo "Extracting HyperOS firmware package..."
        cd input
        tar -I pigz -xvf *.tgz || tar -xvf *.tgz || 7z x *.tgz -r
        cd ..
        
        echo "Locating super.img..."
        SUPER_PATH=$(find input/ -name "super.img" | head -n 1)
        
        if [ -z "$SUPER_PATH" ]; then
          echo "Error: super.img not found!"
          exit 1
        fi
        
        echo "Converting sparse super.img to raw if needed..."
        simg2img "$SUPER_PATH" super_raw.img || cp "$SUPER_PATH" super_raw.img
        
        echo "Unpacking super partition using python lpunpack or alternative..."
        python3 -m pip install --no-cache-dir sparse || true
        
        # محاولة الفك باستخدام lpunpack مع مسار الملف الخام أو العادي
        lpunpack super_raw.img extracted_super/ || lpunpack "$SUPER_PATH" extracted_super/ || true
        
        # إذا لم تقم lpunpack بالفك، سنقوم بنسخ ملف super.img الأصلي مباشرة إلى الـ output لتستخرجه يدوياً إن أردت
        cp "$SUPER_PATH" output/hyperos_super.img
        
        echo "Checking extracted contents..."
        ls -la extracted_super/
        
        # نسخ الأقسام إن وجدت
        if [ "$(ls -A extracted_super/)" ]; then
          cp -r extracted_super/* output/
        fi
        
        # تسمية ملف النظام إن وجد ليكون بصيغة GSI جاهزة
        if [ -f "output/system" ]; then
          mv output/system output/HyperOS-A04-GSI.img
        elif [ -f "output/system.img" ]; then
          mv output/system.img output/HyperOS-A04-GSI.img
        fi
        
        echo "Final contents of output directory:"
        ls -la output/

    - name: Upload Final GSI Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HyperOS-Final-GSI-Samsung-A04
        path: output/*
